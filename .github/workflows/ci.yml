name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --constraint requirements/development.txt -e ".[dev]"

      - name: Check formatting
        run: ruff format --check services scripts

      - name: Lint
        run: ruff check services scripts

      - name: Type check
        run: mypy

      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing

      - name: Enforce deterministic golden set
        run: agentic-evaluator

      - name: Run deterministic red-team suite
        run: pytest services/api/tests/test_security_hardening.py

      - name: Validate repository evidence
        run: python scripts/quality/validate_repository.py

      - name: Audit Python dependencies
        run: pip-audit

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, type check, test, and build
        run: pnpm check:web

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high

  container-config:
    name: Container configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

  gcp-plan-only:
    name: GCP plan-only readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install YAML validator
        run: python -m pip install "pyyaml>=6.0,<7.0"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"

      - name: Validate Terraform and deployment policy without credentials
        shell: pwsh
        run: ./scripts/infra/validate-gcp-readiness.ps1
