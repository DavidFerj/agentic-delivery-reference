[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-delivery-reference"
version = "0.1.0"
description = "Production-shaped reference implementation for agentic AI delivery."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "Agentic Delivery Reference contributors" }]
dependencies = [
  "fastapi>=0.116,<1.0",
  "langgraph>=1.2.10,<1.3",
  "pydantic-settings>=2.10,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3.0",
  "mypy>=1.17,<2.0",
  "pip>=25,<26.2",
  "pip-audit>=2.9,<3.0",
  "pip-tools>=7.5,<8.0",
  "pytest>=8.4,<10.0",
  "pytest-cov>=6.2,<8.0",
  "pyyaml>=6.0,<7.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
agentic-evaluator = "agentic_evaluator.main:main"

[tool.setuptools.packages.find]
where = [
  "services/api/src",
  "services/background-worker/src",
  "services/evaluator/src",
  "services/agent-runtime/src",
  "packages/governance-core/src",
]
include = ["agentic_api*", "agentic_worker*", "agentic_evaluator*", "agentic_runtime*", "agentic_governance*"]
namespaces = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -p no:cacheprovider -ra"
testpaths = [
  "services/agent-runtime/tests",
  "packages/governance-core/tests",
  "services/api/tests",
  "services/background-worker/tests",
  "services/evaluator/tests",
]

[tool.coverage.run]
branch = true
source = ["agentic_api", "agentic_worker", "agentic_evaluator", "agentic_runtime", "agentic_governance"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".next", ".pnpm-store", ".venv", "coverage", "node_modules"]
src = [
  "services/api/src",
  "services/background-worker/src",
  "services/evaluator/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = [
  "services/api/src",
  "services/api/tests",
  "services/background-worker/src",
  "services/background-worker/tests",
  "services/evaluator/src",
  "services/evaluator/tests",
  "services/agent-runtime/src",
  "services/agent-runtime/tests",
  "packages/governance-core/src",
  "packages/governance-core/tests",
]
